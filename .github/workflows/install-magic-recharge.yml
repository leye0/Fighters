name: Magic-paid healing and passive regeneration

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fighters-magic-healing
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply healing-cost and passive-magic rules
        run: git apply scripts/magic-recharge-healing.patch
      - name: Verify healing, magic, combat and game syntax
        run: |
          node scripts/test-rts-healing.mjs
          node scripts/test-rts-souls.mjs
          node scripts/test-rts-raiding.mjs
          node scripts/test-rts-farming.mjs
          node scripts/test-witch-strategy.mjs
          node --check scripts/browser-qa.mjs
          node --check app/rts-healing.js
          node --check app/rts-souls.js
          git diff --check
      - name: Commit tested game rules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/rts-healing.js app/rts-souls.js scripts/test-rts-healing.mjs scripts/test-rts-souls.mjs scripts/browser-qa.mjs
          git diff --cached --check
          git commit -m 'Charge sanctuary healing to magic and regenerate five per thirty seconds'
          bash scripts/publish-generated-result.sh install-magic-recharge
      - name: Publish updated playable game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
