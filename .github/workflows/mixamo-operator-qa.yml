name: Fighters · Mixamo direct browser operator offline QA
on:
  push:
    branches: [main]
    paths:
      - assets/runtime-requests/mixamo-operator-qa.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove Python script and exact Adobe catalog are valid without private session
        run: |
          python3 -m py_compile scripts/mixamo-direct-batch.py
          python3 scripts/mixamo-direct-batch.py --catalog-only
          python3 -m unittest discover -s tests -p 'mixamo-direct-batch.test.py' -v
          python3 -m py_compile scripts/export-character-for-mixamo.py scripts/assemble-native-mixamo.py
