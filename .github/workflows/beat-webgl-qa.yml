name: Fighters · real WebGL gameplay regression
on:
  push:
    branches: [main]
    paths: [assets/runtime-requests/beat-webgl-qa.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fighters-gameplay-visual-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Deterministic engine and animation regression tests
        run: |
          npm ci
          npm test
          npm run build:review
          node scripts/check-baked-gameplay-motion.mjs \
            public/models/claudia.glb public/models/carla.glb public/models/realistic-man.glb
      - name: Inspect genuine Mixamo jump knee trajectory (Claudia)
        run: node scripts/analyze-jump-poses.mjs public/models/claudia.glb > /tmp/real-jump-poses.json
      - name: Print authored knee pose samples
        run: |
          node -e 'const d=require("/tmp/real-jump-poses.json");for(const [name,clip] of Object.entries(d)){if(!clip.poses)continue;console.log(name,clip.duration);console.log(clip.poses.map(p=>[p.fraction,p.knees,p.torsoLean]));}'
      - name: Serve the same review page as GitHub Pages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory docs >/tmp/fighters-http.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/site/beat-em-up.html >/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/fighters-http.log
          exit 1
      - name: Exercise real GLB rig, walking, reversal and jump in software WebGL
        env:
          WEBSUITE_RENDER_BACKEND: software
          WEBSUITE_REQUIRE_FIGHTERS: "1"
        run: node scripts/websuite.mjs --scenario tests/browser/beat-em-up-control.json captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighters-arcade-motion-qa
          path: captures/
          retention-days: 3
          if-no-files-found: warn
