name: Fighters · real WebGL gameplay regression
on:
  push:
    branches: [main]
    paths:
      - assets/runtime-requests/beat-webgl-qa.txt
      - public/models/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fighters-gameplay-visual-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Deterministic engine and animation regression tests
        run: |
          npm ci
          npm test
          npm run animation:verify
          npm run build
      - name: Serve the generated game build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/fighters-http.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/beat-em-up.html >/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/fighters-http.log
          exit 1
      - name: Exercise real GLB rig, walking, reversal and jump in software WebGL
        env:
          WEBSUITE_RENDER_BACKEND: software
          WEBSUITE_REQUIRE_FIGHTERS: "1"
        run: node scripts/websuite.mjs --scenario tests/browser/beat-em-up-control.json captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighters-arcade-motion-qa
          path: captures/
          retention-days: 3
          if-no-files-found: warn
