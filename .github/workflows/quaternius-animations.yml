name: Fighters - CC0 animations on original character rigs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quaternius-animations.yml
      - scripts/build-quaternius-animations.mjs
      - scripts/check-quaternius-models.mjs
      - vite.config.ts
      - beat-em-up.html
      - src/**
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fighters-quaternius-assets-main
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download and checksum the two CC0 Standard archives
        run: |
          set -euo pipefail
          base='https://media.githubusercontent.com/media/MightyBubble/Ludots-Assets/main/animations'
          curl -fLsS --retry 3 --max-time 120 "$base/Quaternius-Universal-Animation-Library-Standard.zip" -o /tmp/ual1.zip
          curl -fLsS --retry 3 --max-time 120 "$base/Quaternius-Universal-Animation-Library-2-Standard.zip" -o /tmp/ual2.zip
          printf 'cc73fc4e495b82958207316596317a3f40b9fa38065bde1027937452da537724  /tmp/ual1.zip\n4008ea208a604773a2b2177d965f0f5d3195498b5bf838c3f5785d68e95f2a68  /tmp/ual2.zip\n' | sha256sum --check
          unzip -jo /tmp/ual1.zip '*/Unreal-Godot/UAL1_Standard.glb' -d /tmp
          unzip -jo /tmp/ual2.zip '*/Unreal-Godot/UAL2_Standard.glb' -d /tmp
      - name: Build and audit all three character GLBs
        run: |
          set -euo pipefail
          node scripts/build-quaternius-animations.mjs /tmp/UAL1_Standard.glb /tmp/UAL2_Standard.glb public/models /tmp/fighters-cc0
          node scripts/check-quaternius-models.mjs /tmp/fighters-cc0
          cp /tmp/fighters-cc0/claudia.glb public/models/claudia.glb
          cp /tmp/fighters-cc0/carla.glb public/models/carla.glb
          cp /tmp/fighters-cc0/realistic-man.glb public/models/realistic-man.glb
          cp /tmp/fighters-cc0/quaternius-audit.json public/models/quaternius-audit.json
          npm run animation:verify
      - name: Typecheck, tests and build
        run: |
          npm test
          npm run build
      - name: Publish audited GLBs and Vite output directly on main
        run: |
          set -euo pipefail
          mkdir -p docs/site
          rsync -a --delete dist/ docs/site/
          git add public/models docs/site
          if git diff --cached --quiet; then
            echo 'Already up to date'
            exit 0
          fi
          git -c user.name='fighters-animation-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Bake Quaternius CC0 animations onto the three Fighters skins'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quaternius-character-audit
          path: /tmp/fighters-cc0/quaternius-audit.json
          retention-days: 3
          if-no-files-found: warn
