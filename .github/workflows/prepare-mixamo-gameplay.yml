name: Prepare Mixamo gameplay animations for real fighters

on:
  push:
    branches: [main]
    paths:
      - assets/runtime-requests/mixamo-gameplay.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fighters-prepare-mixamo-gameplay
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Set private animation workspace after runner initialization
        run: echo "ANIM_WORK_DIR=$RUNNER_TEMP/fighters-mixamo" >> "$GITHUB_ENV"
      - name: Install tested dependencies and private FBX converter
        run: |
          npm ci
          npm install --prefix "$ANIM_WORK_DIR/converter" --no-package-lock --no-save fbx2gltf@0.9.7-p1

      - name: Obtain precisely seven catalogued Mixamo source motions in private scratch
        run: |
          python3 scripts/acquire-mixamo.py \
            --destination "$ANIM_WORK_DIR/fbx" --workers 1 --request-interval 5 --retries 0 \
            --name Fighting_Idle.fbx --name Walking_21.fbx \
            --name Walking_6.fbx --name Walking_Backwards.fbx --name Left_Turn_3.fbx \
            --name Jump.fbx --name Falling_Idle.fbx

      - name: Convert real motions without exposing reusable source files in git
        run: |
          python3 scripts/convert-mixamo-fbx.py \
            --input "$ANIM_WORK_DIR/fbx" --output "$ANIM_WORK_DIR/glb" \
            --converter "$ANIM_WORK_DIR/converter/node_modules/fbx2gltf/bin/Linux/FBX2glTF" \
            --workers 4 --require-all \
            --name Fighting_Idle.fbx --name Walking_21.fbx \
            --name Walking_6.fbx --name Walking_Backwards.fbx --name Left_Turn_3.fbx \
            --name Jump.fbx --name Falling_Idle.fbx

      - name: Embed seven retargeted Mixamo motions inside licensed game character GLBs
        run: |
          node scripts/embed-mixamo-gameplay.mjs "$ANIM_WORK_DIR/glb" \
            public/models/claudia.glb "$ANIM_WORK_DIR/claudia.game.glb" \
            public/models/carla.glb "$ANIM_WORK_DIR/carla.game.glb" \
            public/models/realistic-man.glb "$ANIM_WORK_DIR/realistic-man.game.glb"
          node scripts/check-baked-gameplay-motion.mjs \
            "$ANIM_WORK_DIR/claudia.game.glb" \
            "$ANIM_WORK_DIR/carla.game.glb" \
            "$ANIM_WORK_DIR/realistic-man.game.glb"
          for character in claudia carla realistic-man; do
            python3 scripts/inspect-runtime-glb.py "$ANIM_WORK_DIR/$character.game.glb"
            cp "$ANIM_WORK_DIR/$character.game.glb" "public/models/$character.glb"
          done

      - name: Test, build and publish only game-integrated character assets
        run: |
          npm test
          npm run build:review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models docs/site
          if git diff --cached --quiet; then
            echo "No gameplay motion changes."
          else
            git commit -m "Embed verified Mixamo locomotion and 180 turn in real fighter rigs"
            git push origin HEAD:main
          fi
