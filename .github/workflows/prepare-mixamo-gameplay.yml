# RETIRED: the owner's chosen pipeline is Adobe Mixamo applied directly to
# each original human FBX rig, followed by native same-rig Blender assembly.
# Historical source and commits are preserved in git for diagnostics only.
# No job in this workflow may create or publish YBot-transferred animations.
name: Deprecated legacy YBot Mixamo retarget — disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: No legacy animation publishing
        run: |
          echo "::notice::The YBot-to-character retarget pipeline is retired."
          echo "Use the direct-rig Adobe Mixamo → Blender workflow instead."
          echo "See docs/mixamo-native-pipeline.md"
