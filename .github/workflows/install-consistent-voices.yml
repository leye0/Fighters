name: Restore phrase variety and deepen Orc voices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-consistent-voices.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: fighters-voice-variety
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm high-quality pitch shift support
        run: ffmpeg -hide_banner -h filter=rubberband > /dev/null
      - name: Apply per-unit phrase rotations
        run: git apply scripts/consistent-voices.patch
      - name: Verify role identities, events and rotations
        run: |
          node scripts/test-rts-sound.mjs
          node scripts/test-voice-catalog.mjs
          node scripts/test-rts-roles.mjs
          node --check docs/rts-sound.js
          python3 -m py_compile scripts/clone-witch-battle-lines.py scripts/retune-orc-speech.py
      - name: Regenerate Witch cries from each approved shouted voice
        env:
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
        run: python3 scripts/clone-witch-battle-lines.py
      - name: Lower Orc speech by 5.7 semitones without slowing
        run: python3 scripts/retune-orc-speech.py
      - name: Validate generated identities and audio assets
        run: |
          node scripts/test-voice-refresh.mjs
          node scripts/test-voice-catalog.mjs
          node scripts/test-rts-sound.mjs
          git diff --check
      - name: Commit the full verified audio library and runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/rts-sound.js scripts/test-rts-sound.mjs \
            docs/sounds/orcs docs/sounds/witches
          git diff --cached --check
          git commit -m 'Rotate consistent Witch phrases and deepen Orc speech without slowing'
          git push origin HEAD:main
      - name: Publish the playable game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
