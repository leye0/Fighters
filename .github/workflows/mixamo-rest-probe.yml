name: Fighters · Mixamo REST anonymous access probe
on:
  push:
    branches: [main]
    paths:
      - assets/runtime-requests/mixamo-rest-probe.txt
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check documented internal endpoint without any account
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          url = "https://www.mixamo.com/api/v1/products?type=Motion%2CMotionPack&query=Walking"
          request = urllib.request.Request(url, headers={"Accept":"application/json","X-Api-Key":"mixamo2","User-Agent":"Fighters-research-access-probe"})
          try:
              with urllib.request.urlopen(request, timeout=12) as reply:
                  print("MIXAMO_API_ANONYMOUS_HTTP_STATUS",reply.status)
                  print("MIXAMO_API_CONTENT_TYPE",reply.headers.get("Content-Type"))
                  raw=reply.read(250000)
                  print("MIXAMO_API_CONTENT_BYTES",len(raw))
                  if reply.status == 200 and "json" in reply.headers.get("Content-Type",""):
                      import json
                      document=json.loads(raw)
                      print("MIXAMO_API_RESPONSE_KEYS",sorted(document))
                      print("MIXAMO_API_PAGINATION",json.dumps(document.get("pagination",{})))
                      items=document.get("results",[])
                      print("MIXAMO_API_ITEMS",len(items))
                      print("MIXAMO_API_FIRST_ITEMS",json.dumps([
                          {"id":x.get("id"),"name":x.get("name"),
                           "description":x.get("description"),"keys":sorted(x)}
                          for x in items[:6]
                      ]))
                  # Probe one exact public motion UUID without a character.
                  motion_id="c9c634c5-b96c-11e4-a802-0aaa78deedf9"
                  detail_url="https://www.mixamo.com/api/v1/products/"+motion_id+"?similar=0"
                  try:
                      with urllib.request.urlopen(urllib.request.Request(detail_url,headers={"Accept":"application/json","X-Api-Key":"mixamo2"}),timeout=12) as detail:
                          payload=json.loads(detail.read(200000))
                          print("MIXAMO_ANONYMOUS_PRODUCT_DETAIL_STATUS",detail.status)
                          print("MIXAMO_ANONYMOUS_PRODUCT_DETAIL_KEYS",sorted(payload))
                          print("MIXAMO_ANONYMOUS_HAS_GMS_HASH",bool((payload.get("details") or {}).get("gms_hash")))
                  except urllib.error.HTTPError as error:
                      print("MIXAMO_ANONYMOUS_PRODUCT_DETAIL_STATUS",error.code)
          except urllib.error.HTTPError as e:
              print("MIXAMO_API_ANONYMOUS_HTTP_STATUS",e.code)
              print("MIXAMO_API_CONTENT_TYPE",e.headers.get("Content-Type"))
              print("MIXAMO_API_CREDENTIALS_NOT_SENT")
          except Exception as e:
              print("MIXAMO_API_CONNECTION_FAILED",type(e).__name__)
              raise
          PY
      - name: Verify seven exact Mixamo UUID, names, descriptions and motion settings
        run: python3 scripts/verify-mixamo-public-catalog.py
