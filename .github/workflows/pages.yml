name: Fighters — publish playable game
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crops_low_poly.glb'
      - 'scripts/build-runtime-crops.mjs'
      - 'witch_house.glb'
      - 'orc_rts_building_set_-_proto_series.glb.part*'
      - 'scripts/verify-glb.mjs'
      - 'scripts/compress-character-assets.sh'
      - 'scripts/build-runtime-characters.mjs'
      - 'scripts/split-orc-buildings.mjs'
      - 'scripts/test-orc-building-assets.mjs'
      - 'scripts/generate-building-footprints.mjs'
      - 'scripts/union-xz-triangles.py'
      - 'scripts/verify-costumes.mjs'
      - 'scripts/download-costumes.sh'
      - 'scripts/pack-hair-long.mjs'
      - 'scripts/download-sword.sh'
      - 'scripts/decompress-sword.mjs'
      - 'scripts/prepare-runtime-assets.sh'
      - 'scripts/use-pinned-runtime-assets.sh'
      - 'assets/runtime-assets.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fighters-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/fighters
          key: fighters-runtime-${{ hashFiles('assets/runtime-assets.lock') }}
      - name: Restore verified, prebuilt runtime assets
        run: bash scripts/use-pinned-runtime-assets.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}
      - name: Publish verified site
        id: publish
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
