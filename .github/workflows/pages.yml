name: Fighters — publish playable game
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'witch_house.glb'
      - 'orc_rts_building_set_-_proto_series.glb.part*'
      - 'scripts/verify-glb.mjs'
      - 'scripts/verify-costumes.mjs'
      - 'scripts/download-costumes.sh'
      - 'scripts/download-sword.sh'
      - 'scripts/decompress-sword.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fighters-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and pin upstream models into the Pages artifact
        run: |
          mkdir -p docs/models
          cp witch_house.glb docs/models/witch_house.glb
          cat orc_rts_building_set_-_proto_series.glb.part1 orc_rts_building_set_-_proto_series.glb.part2 > docs/models/orc_rts_building_set_-_proto_series.glb
          node -e "const fs=require('fs');const p='docs/models/orc_rts_building_set_-_proto_series.glb';const b=fs.readFileSync(p);if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)process.exit(1);console.log('Orc GLB validated:',b.length,'bytes')"
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/5821923af517ac5fdc82505faa92a0d575fc1b1a/test/human_male.glb" \
            --output docs/models/human_male.glb
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/5821923af517ac5fdc82505faa92a0d575fc1b1a/test/human_female.glb" \
            --output docs/models/human_female.glb
          node scripts/verify-glb.mjs docs/models/human_male.glb docs/models/human_female.glb
          bash scripts/download-costumes.sh
          bash scripts/download-sword.sh
          npm install --no-save --no-package-lock --no-audit --no-fund meshoptimizer@0.25.0
          node scripts/decompress-sword.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish verified site
        id: publish
        uses: actions/deploy-pages@v4