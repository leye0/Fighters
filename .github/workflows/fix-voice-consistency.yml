name: Pin unit voices across repeated clicks

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fighters-pin-unit-voices
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply per-character voice consistency fix
        run: git apply scripts/voice-consistency.patch
      - name: Test same-unit voice identity and unchanged catalogs
        run: |
          node scripts/test-rts-sound.mjs
          node scripts/test-voice-catalog.mjs
          node scripts/test-rts-roles.mjs
          node scripts/test-rts-raiding.mjs
          node --check docs/rts-sound.js
          git diff --check
      - name: Commit verified voice fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/rts-sound.js scripts/test-rts-sound.mjs
          git diff --cached --check
          git commit -m 'Keep one consistent recorded voice per unit'
          bash scripts/publish-generated-result.sh fix-voice-consistency
      - name: Publish the corrected game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
