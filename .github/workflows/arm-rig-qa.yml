name: Fighters · arm skeleton diagnostic
on:
  push:
    branches: [main]
    paths: [assets/runtime-requests/arm-rig-qa.txt]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: fighters-arm-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Compare anatomical rest poses and every authored walk phase
        run: |
          node scripts/analyze-arm-poses.mjs public/models/claudia.glb public/models/carla.glb public/models/realistic-man.glb > arm-audit.jsonl
          node -e 'const fs=require("fs");const xs=fs.readFileSync("arm-audit.jsonl","utf8").trim().split("\n").map(JSON.parse); for(const x of xs){console.log(x.file,"REST",JSON.stringify(x.rest));for(const name of new Set(x.samples.map(s=>s.clip))){const list=x.samples.filter(s=>s.clip===name);console.log(name,JSON.stringify(list.map(y=>[y.phase,y.left.reachRatio,y.right.reachRatio,y.left.elbowOffset,y.right.elbowOffset,y.left.wristOffset,y.right.wristOffset])));}}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighters-real-arm-pose-audit
          path: arm-audit.jsonl
          retention-days: 3
          if-no-files-found: warn
