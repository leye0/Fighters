name: Import Sketchfab character into GitHub

# Manual dispatch, or a narrowly scoped request file for coding agents that
# cannot call the Actions workflow-dispatch API. Never runs on ordinary pushes.
on:
  push:
    branches: [main]
    paths:
      - assets/import-requests/sketchfab-character.txt
  workflow_dispatch:
    inputs:
      character:
        description: Existing candidate to acquire (one model per run)
        required: true
        type: choice
        default: claudia
        options:
          - claudia
          - carla
          - realistic-man

permissions:
  contents: write

concurrency:
  group: fighters-sketchfab-${{ inputs.character }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout acquisition script and candidate registry
        uses: actions/checkout@v4

      - name: Download from the official authenticated Sketchfab API
        env:
          SKETCHFAB_KEY: ${{ secrets.SKETCHFAB_KEY }}
          CHARACTER: ${{ inputs.character }}
        run: |
          if [ -z "$CHARACTER" ]; then
            CHARACTER="$(head -n 1 assets/import-requests/sketchfab-character.txt)"
          fi
          python3 scripts/import-sketchfab-character.py --character "$CHARACTER" --output assets/source/characters

      - name: Commit original model, attribution and audit directly on main
        env:
          CHARACTER: ${{ inputs.character }}
        run: |
          if [ -z "$CHARACTER" ]; then
            CHARACTER="$(head -n 1 assets/import-requests/sketchfab-character.txt)"
          fi
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source/characters assets/manifest.json
          if git diff --cached --quiet; then
            echo "Selected model is already up to date in GitHub."
          else
            git commit -m "Import Sketchfab character source: $CHARACTER"
            git push origin HEAD:main
          fi
