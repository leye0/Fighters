name: Generate three independent Fighters music themes

on:
  push:
    branches:
      - music/fighters-three-themes-20261106
    paths:
      - .github/workflows/generate-fighters-three-themes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fighters-three-themes-one-shot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN || secrets.REPLICATE_API_KEY || secrets.REPLICATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ffmpeg to create independent seamless loops
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate two exploration themes and one battle theme
        run: python3 scripts/generate_fighters_three_themes.py
      - name: Upload all three loop-ready tracks and original audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fighters-three-original-soundtrack-themes
          path: docs/music/three-themes/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit loop-ready themes to this isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/music/three-themes/*-loop.mp3 docs/music/three-themes/generation.json
          if ! git diff --cached --quiet; then
            git commit -m "Add three independent loop-ready Fighters orchestral themes"
            if [ "${GITHUB_REF_NAME}" = main ]; then
              # Manual runs from main must not publish unreviewed generated music.
              git push origin "HEAD:refs/heads/automation-results/music-themes/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
            else
              git push origin HEAD:"${GITHUB_REF_NAME}"
            fi
          fi
