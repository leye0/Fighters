name: Fighters — real WebGL browser QA
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/rts-footprint.js'
      - 'docs/rts-navigation.js'
      - 'docs/rts-fog.js'
      - 'docs/rts-sound.js'
      - 'scripts/test-rts-sound.mjs'
      - 'scripts/test-rts-fog.mjs'
      - 'scripts/test-rts-footprint.mjs'
      - 'docs/rts-unit-physics.js'
      - 'scripts/test-rts-unit-physics.mjs'
      - 'docs/orc-strategy.js'
      - 'docs/rts-roles.js'
      - 'scripts/test-rts-roles.mjs'
      - 'scripts/test-orc-strategy.mjs'
      - 'scripts/compress-character-assets.sh'
      - 'scripts/build-runtime-characters.mjs'
      - 'scripts/test-rts-navigation.mjs'
      - 'scripts/browser-qa.mjs'
      - 'scripts/verify-costumes.mjs'
      - 'witch_house.glb'
      - 'orc_rts_building_set_-_proto_series.glb.part*'
      - 'scripts/split-orc-buildings.mjs'
      - 'scripts/generate-building-footprints.mjs'
      - 'scripts/union-xz-triangles.py'
      - 'scripts/download-costumes.sh'
      - 'scripts/download-sword.sh'
      - 'scripts/decompress-sword.mjs'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic navigation and orc strategic planning
        run: |
          node scripts/test-rts-footprint.mjs
          node scripts/test-rts-navigation.mjs
          node scripts/test-rts-fog.mjs
          node scripts/test-rts-sound.mjs
          node scripts/test-rts-unit-physics.mjs
          node scripts/test-orc-strategy.mjs
          node scripts/test-rts-roles.mjs
      - name: Prepare complete RTS building assets and native character models
        run: |
          mkdir -p docs/models
          cp witch_house.glb docs/models/witch_house.glb
          cat orc_rts_building_set_-_proto_series.glb.part1 orc_rts_building_set_-_proto_series.glb.part2 > docs/models/orc_rts_building_set_-_proto_series.glb
          npm install --no-save --no-package-lock --no-audit --no-fund @gltf-transform/core@4.2.1 @gltf-transform/functions@4.2.1 three@0.180.0 @gltf-transform/extensions@4.2.1 sharp@0.34.4
          mkdir -p docs/vendor/three
          cp node_modules/three/build/three.module.js docs/vendor/three/three.module.js
          cp node_modules/three/build/three.core.js docs/vendor/three/three.core.js
          cp -R node_modules/three/examples/jsm docs/vendor/three/addons
          node scripts/split-orc-buildings.mjs docs/models/orc_rts_building_set_-_proto_series.glb docs/models/orc-buildings
          python3 -m pip install --disable-pip-version-check shapely==2.1.2
          node scripts/generate-building-footprints.mjs docs/models/witch_house.glb docs/models/orc-buildings
          curl -fLsS --retry 3 https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/5821923af517ac5fdc82505faa92a0d575fc1b1a/test/human_male.glb -o docs/models/human_male.glb
          curl -fLsS --retry 3 https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/5821923af517ac5fdc82505faa92a0d575fc1b1a/test/human_female.glb -o docs/models/human_female.glb
          node scripts/verify-glb.mjs docs/models/human_male.glb docs/models/human_female.glb
          bash scripts/compress-character-assets.sh docs/models
          node scripts/build-runtime-characters.mjs docs/models
          bash scripts/download-costumes.sh
          bash scripts/download-sword.sh
          npm install --no-save --no-package-lock --no-audit --no-fund meshoptimizer@0.25.0
          node scripts/decompress-sword.mjs
      - name: Start preview server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/fighters-browser-qa-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Exercise RTS factions, queues, selection and construction in Chrome SwiftShader
        env:
          FIGHTERS_URL: http://127.0.0.1:8000/
        run: |
          google-chrome --version
          node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighters-real-webgl-rts-qa
          path: captures/
          retention-days: 3
          if-no-files-found: ignore