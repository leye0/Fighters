name: Fighters — real WebGL browser QA
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/styles/**'
      - 'docs/rts-map.js'
      - 'docs/rts-footprint.js'
      - 'docs/rts-walls.js'
      - 'docs/rts-navigation.js'
      - 'docs/rts-raiding.js'
      - 'docs/rts-fog.js'
      - 'docs/rts-sound.js'
      - 'docs/rts-effects.js'
      - 'docs/sounds/effects/**'
      - 'docs/rts-farming.js'
      - 'docs/rts-orc-food.js'
      - 'docs/HARE_ASSET_LICENSE.md'
      - 'docs/rts-forest.js'
      - 'docs/rts-berries.js'
      - 'docs/rts-ravens.js'
      - 'docs/rts-healing.js'
      - 'docs/rts-repair.js'
      - 'docs/rts-souls.js'
      - 'docs/models/standing-stone.glb'
      - 'docs/models/STANDING_STONE_LICENSE.md'
      - 'docs/models/forest/**'
      - 'scripts/test-rts-forest.mjs'
      - 'scripts/test-rts-berries.mjs'
      - 'scripts/test-rts-ravens.mjs'
      - 'scripts/test-rts-healing.mjs'
      - 'scripts/test-rts-repair.mjs'
      - 'scripts/test-rts-souls.mjs'
      - 'scripts/test-rts-farming.mjs'
      - 'scripts/test-rts-orc-food.mjs'
      - 'scripts/test-rts-sound.mjs'
      - 'scripts/test-rts-effects.mjs'
      - 'scripts/test-rts-fog.mjs'
      - 'scripts/test-rts-footprint.mjs'
      - 'scripts/test-rts-walls.mjs'
      - 'docs/rts-unit-physics.js'
      - 'scripts/test-rts-unit-physics.mjs'
      - 'docs/orc-strategy.js'
      - 'docs/witch-strategy.js'
      - 'docs/rts-roles.js'
      - 'docs/orc-appearance.js'
      - 'scripts/test-rts-roles.mjs'
      - 'scripts/test-orc-appearance.mjs'
      - 'scripts/test-orc-strategy.mjs'
      - 'scripts/test-witch-strategy.mjs'
      - 'scripts/compress-character-assets.sh'
      - 'scripts/build-runtime-characters.mjs'
      - 'scripts/test-rts-navigation.mjs'
      - 'scripts/test-rts-raiding.mjs'
      - 'scripts/test-rts-map.mjs'
      - 'scripts/browser-qa.mjs'
      - 'scripts/browser-qa/**'
      - 'scripts/prepare-runtime-assets.sh'
      - 'scripts/use-pinned-runtime-assets.sh'
      - 'assets/runtime-assets.lock'
      - 'scripts/verify-costumes.mjs'
      - 'crops_low_poly.glb'
      - 'scripts/build-runtime-crops.mjs'
      - 'witch_house.glb'
      - 'orc_rts_building_set_-_proto_series.glb.part*'
      - 'scripts/split-orc-buildings.mjs'
      - 'scripts/test-orc-building-assets.mjs'
      - 'scripts/generate-building-footprints.mjs'
      - 'scripts/union-xz-triangles.py'
      - 'scripts/download-costumes.sh'
      - 'scripts/pack-hair-long.mjs'
      - 'scripts/fetch-pinned-humans.sh'
      - 'scripts/download-sword.sh'
      - 'scripts/decompress-sword.mjs'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    name: Prepare verified runtime assets
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic navigation and orc strategic planning
        run: |
          node --check scripts/browser-qa.mjs
          for qa_file in scripts/browser-qa/*.mjs; do node --check "$qa_file"; done
          node scripts/test-rts-footprint.mjs
          node scripts/test-rts-walls.mjs
          node scripts/test-rts-navigation.mjs
          node scripts/test-rts-raiding.mjs
          node scripts/test-rts-map.mjs
          node scripts/test-rts-fog.mjs
          node scripts/test-rts-sound.mjs
          node scripts/test-rts-effects.mjs
          node scripts/test-rts-unit-physics.mjs
          node scripts/test-orc-strategy.mjs
          node scripts/test-witch-strategy.mjs
          node scripts/test-rts-roles.mjs
          node scripts/test-orc-appearance.mjs
          node scripts/test-rts-farming.mjs
          node scripts/test-rts-orc-food.mjs
          node scripts/test-rts-forest.mjs
          node scripts/test-rts-berries.mjs
          node scripts/test-rts-ravens.mjs
          node scripts/test-rts-healing.mjs
          node scripts/test-rts-repair.mjs
          node scripts/test-rts-souls.mjs
      - uses: actions/cache@v4
        with:
          path: .cache/fighters
          key: fighters-runtime-${{ hashFiles('assets/runtime-assets.lock') }}
      - name: Restore verified, prebuilt runtime assets
        run: bash scripts/use-pinned-runtime-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fighters-runtime-assets
          path: |
            docs/models
            docs/vendor
          retention-days: 1
          if-no-files-found: error
  chrome:
    name: Chrome ${{ matrix.group }}
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [visual, economy, combat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fighters-runtime-assets
          path: docs
      - name: Verify restored runtime assets
        run: |
          test -s docs/models/witch_house.glb
          test -s docs/models/orc-buildings/manifest.json
          test -s docs/models/human_male.rts.glb.gz
          test -s docs/vendor/three/three.module.js
      - name: Start preview server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/fighters-browser-qa-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Exercise RTS factions, queues, selection and construction in Chrome SwiftShader
        env:
          FIGHTERS_URL: http://127.0.0.1:8000/
          FIGHTERS_QA_GROUP: ${{ matrix.group }}
        run: |
          google-chrome --version
          node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighters-real-webgl-rts-qa-${{ matrix.group }}
          path: captures/
          retention-days: 3
          if-no-files-found: ignore
