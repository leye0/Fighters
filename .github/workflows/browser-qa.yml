  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_assets:
        description: 'Exceptionally build and publish the next immutable asset version'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  assets:
    name: Prepare verified runtime assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      rebuild: ${{ steps.choose.outputs.rebuild }}
      version: ${{ steps.choose.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic navigation and orc strategic planning
        run: |
          node --check scripts/browser-qa.mjs
          for qa_file in scripts/browser-qa/*.mjs; do node --check "$qa_file"; done
          node scripts/test-rts-footprint.mjs
          node scripts/test-rts-walls.mjs
          node scripts/test-rts-building-placement.mjs
          node scripts/test-rts-navigation.mjs
          node scripts/test-rts-actor-navigation.mjs
          node scripts/test-rts-damage-cycle.mjs
          node scripts/test-rts-village-defense.mjs
          node scripts/test-rts-visibility-cycle.mjs
          node scripts/test-rts-raiding.mjs
          node scripts/test-rts-map.mjs
          node scripts/test-rts-fog.mjs
          node scripts/test-rts-sound.mjs
          node scripts/test-voice-catalog.mjs
          node scripts/test-rts-effects.mjs
          node scripts/test-rts-unit-physics.mjs
          node scripts/test-rts-simulation.mjs
          node scripts/test-rts-unit-tick.mjs
          node scripts/test-rts-architecture.mjs
          node scripts/test-rts-chrome-retry.mjs
          node scripts/test-rts-session-state.mjs
          node scripts/test-rts-spell-cycle.mjs
          node scripts/test-rts-match-state.mjs
          node scripts/test-rts-world-state.mjs
          node scripts/test-rts-match-lifecycle.mjs
          node scripts/test-rts-orders.mjs
          node scripts/test-rts-worker-orders.mjs
          node scripts/test-rts-construction-orders.mjs
          node scripts/test-rts-production-orders.mjs
          node scripts/test-rts-picking.mjs
          node scripts/test-rts-camera.mjs
          node scripts/test-rts-gestures.mjs
          node scripts/test-rts-player-interaction.mjs
          node scripts/test-rts-player-actions.mjs
          node scripts/test-rts-minimap.mjs
          node scripts/test-rts-hud.mjs
          node scripts/test-rts-ai-commands.mjs
          node scripts/test-rts-ai-observations.mjs
          node scripts/test-rts-assets.mjs
          node scripts/test-rts-model-assets.mjs
          node scripts/test-orc-strategy.mjs
          node scripts/test-witch-strategy.mjs
          node scripts/test-rts-roles.mjs
          node scripts/test-orc-appearance.mjs
          node scripts/test-rts-farming.mjs
          node scripts/test-rts-orc-food.mjs
          node scripts/test-rts-orc-forager.mjs
          node scripts/test-rts-orc-hunt-planner.mjs
          node scripts/test-rts-food-cycle.mjs
          node scripts/test-rts-forest.mjs
          node scripts/test-rts-berries.mjs
          node scripts/test-rts-ravens.mjs
          node scripts/test-rts-raven-distraction.mjs
          node scripts/test-rts-healing.mjs
          node scripts/test-rts-healing-cycle.mjs
          node scripts/test-rts-repair.mjs
          node scripts/test-rts-souls.mjs
          node scripts/test-rts-soul-harvester.mjs
          node scripts/test-rts-mining-cycle.mjs
          node scripts/test-rts-wood-cycle.mjs
          node scripts/test-rts-garden-worker-cycle.mjs
          node scripts/test-rts-berry-forager-cycle.mjs
          node scripts/test-rts-construction-worker-cycle.mjs
          node scripts/test-rts-runtime-asset-changes.mjs
      - name: Decide whether source assets need rebuilding
        id: choose
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          REQUESTED_REBUILD: ${{ inputs.rebuild_assets }}
        run: |
          set -euo pipefail
          rebuild=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_REBUILD" == true ]]; then
            rebuild=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]] &&
               ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
            fi
            rebuild="$(node scripts/runtime-asset-changes.mjs "$PREVIOUS_SHA" "$GITHUB_SHA")"
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          if [[ "$rebuild" == true ]]; then
            old_tag="$(sed -n 's/^tag=//p' assets/runtime-assets.lock)"
            if [[ ! "$old_tag" =~ ^fighters-runtime-assets-v([0-9]+)$ ]]; then
              echo 'Invalid runtime asset version in lock' >&2
              exit 1
            fi
            version="v$(( ${BASH_REMATCH[1]} + 1 ))"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Rebuilding pinned sources into ${version}."
          else
            echo 'Restoring the existing verified archive; no rebuild needed.'
          fi
      - uses: actions/cache@v4
        if: steps.choose.outputs.rebuild != 'true'
        with:
          path: .cache/fighters
          key: fighters-runtime-${{ hashFiles('assets/runtime-assets.lock') }}
      - name: Restore verified, prebuilt runtime assets
        if: steps.choose.outputs.rebuild != 'true'
        run: bash scripts/use-pinned-runtime-assets.sh
      - name: Rebuild runtime assets from pinned sources
        if: steps.choose.outputs.rebuild == 'true'
        run: bash scripts/prepare-runtime-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fighters-runtime-assets
          path: |
            app/models
            app/vendor
          retention-days: 1
          if-no-files-found: error
  chrome:
    name: Chrome ${{ matrix.group }}
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [visual, economy, combat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fighters-runtime-assets
          path: app
      - name: Verify restored runtime assets
        run: |
          test -s app/models/witch_house.glb
          test -s app/models/orc-buildings/manifest.json
          test -s app/models/human_male.rts.glb.gz
          test -s app/vendor/three/three.module.js
      - name: Start preview server
        run: |
          python3 -m http.server 8000 --directory app >/tmp/fighters-browser-qa-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Exercise RTS factions, queues, selection and construction in Chrome SwiftShader
        env:
          FIGHTERS_URL: http://127.0.0.1:8000/
          FIGHTERS_QA_GROUP: ${{ matrix.group }}
        run: |
          google-chrome --version
          node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighters-real-webgl-rts-qa-${{ matrix.group }}
          path: captures/
          retention-days: 3
          if-no-files-found: ignore
  publish_assets:
    name: Publish newly verified runtime assets
    if: github.event_name != 'pull_request' && needs.assets.outputs.rebuild == 'true'
    needs: [assets, chrome]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: fighters-runtime-assets-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      FIGHTERS_ASSET_VERSION: ${{ needs.assets.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fighters-runtime-assets
          path: app
      - name: Publish only the archive tested by Chrome and pin its SHA-256
        run: bash scripts/publish-runtime-assets.sh
