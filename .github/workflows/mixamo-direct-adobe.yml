name: Fighters · Adobe direct Mixamo (private)

on:
  push:
    branches: [main]
    paths:
      - assets/runtime-requests/mixamo-direct-adobe.txt
  workflow_dispatch:
    inputs:
      character:
        required: true
        type: choice
        options:
          - claudia
          - carla
          - realistic-man
        default: claudia

permissions:
  contents: read

jobs:
  direct_mixamo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CHARACTER: ${{ inputs.character || 'claudia' }}
      MIXAMO_STORAGE_STATE_B64: ${{ secrets.MIXAMO_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for previously authorized Adobe session
        run: |
          if test -z "$MIXAMO_STORAGE_STATE_B64"; then
            echo "::error::No authorized Adobe session; add repository secret MIXAMO_STORAGE_STATE_B64"
            exit 2
          fi
      - name: Install Blender and real Chromium
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate exact motion catalog and browser operator
        run: |
          python -m py_compile scripts/mixamo-direct-batch.py
          python -m unittest discover -s tests -p 'test_mixamo_direct_batch.py' -v
      - name: Prepare original same-rig FBX
        run: |
          mkdir -p "$RUNNER_TEMP/clean" "$RUNNER_TEMP/upload" "$RUNNER_TEMP/download" "$RUNNER_TEMP/final"
          git show 8979a7f8550ab78f5906eea9eca9ddbbd0ce2c88:public/models/"$CHARACTER".glb > "$RUNNER_TEMP/clean/$CHARACTER.glb"
          blender -b -t 2 --python-exit-code 1 --python scripts/export-character-for-mixamo.py -- "$RUNNER_TEMP/clean/$CHARACTER.glb" "$RUNNER_TEMP/upload/$CHARACTER.fbx"
          blender -b -t 2 --python-exit-code 1 --python scripts/check-mixamo-export.py -- "$RUNNER_TEMP/upload/$CHARACTER.fbx"
      - name: Adobe upload, seven exact animations, original-skin FBX downloads
        run: |
          python scripts/mixamo-direct-batch.py --headless \
            --character "$CHARACTER" --input-dir "$RUNNER_TEMP/upload" \
            --output-dir "$RUNNER_TEMP/download"
      - name: Combine seven same-rig FBX animations in Blender
        run: |
          bash scripts/build-native-mixamo.sh "$RUNNER_TEMP/download/$CHARACTER" "$RUNNER_TEMP/final/$CHARACTER-native.glb"
          python scripts/check-native-mixamo-glb.py "$RUNNER_TEMP/final/$CHARACTER-native.glb"
      - name: Upload ONLY unpublished integrated GLB for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: fighters-real-adobe-${{ inputs.character || 'claudia' }}-UNPUBLISHED
          path: ${{ runner.temp }}/final/*.glb
          retention-days: 2
          if-no-files-found: error
